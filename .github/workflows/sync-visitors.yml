name: 방문 기록 갱신

on:
  workflow_dispatch:
  schedule:
    # 매일 한국 시간 오전 9시 17분. 전날까지의 완성된 집계를 가져옵니다.
    - cron: '17 0 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-visitors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      GOATCOUNTER_START_DATE: ${{ vars.GOATCOUNTER_START_DATE }}
      PAGES_WORKFLOW: ${{ vars.PAGES_WORKFLOW }}
    steps:
      - name: 설정 확인
        id: configured
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -z "$GOATCOUNTER_CODE" ] || [ -z "$GOATCOUNTER_TOKEN" ] || [ -z "$GOATCOUNTER_START_DATE" ] || [ -z "$PAGES_WORKFLOW" ]; then
            echo '통계 연결 설정이 아직 완료되지 않았습니다.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: 배포 작업이 수동 실행을 지원하는지 확인
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow view "$PAGES_WORKFLOW" --yaml > /tmp/insights-pages-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('/tmp/insights-pages-workflow.yml').read_text()
          if not re.search(r'\bworkflow_dispatch\b', source):
              raise SystemExit('기존 배포 작업에 workflow_dispatch를 먼저 추가해 주세요.')
          PY
      - name: 전날까지의 기록 조회
        if: steps.configured.outputs.ready == 'true'
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python tools/sync_visitors.py
      - name: 집계 파일 저장
        if: steps.configured.outputs.ready == 'true'
        run: |
          if git diff --quiet -- assets/data/visits.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/visits.json
          git commit -m '방문 기록 갱신'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: 기존 블로그 배포 작업 실행
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # 저장소 기본 토큰의 커밋은 배포 작업을 자동으로 시작하지 않으므로 명시적으로 실행합니다.
        run: gh workflow run "$PAGES_WORKFLOW" --ref "$DEFAULT_BRANCH"
