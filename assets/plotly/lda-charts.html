<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LDA 차트</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--ink:#1b2430;--muted:#5d6d7e;--line:#e6ebf0;--bg:#f7f9fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:20px;margin:4px 0 8px}
.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:#1b2430;color:#fff;border-color:#1b2430}
.hint{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55;color:#34495e;margin-bottom:10px}
#chart{width:100%;height:560px;background:#fff;border:1px solid var(--line);border-radius:12px}
.hash-targets{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <h1>LDA</h1>
  <p class="lead">두 반이 얇고 긴 띠로 나란히 있습니다. PCA 1축은 긴 분산, LDA 1축은 반을 가르는 방향입니다.</p>
  <div class="hash-targets" aria-hidden="true">
    <span id="scatter"></span><span id="lda"></span><span id="pca"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="hint" id="hint"></div>
  <div id="chart"></div>
</div>
<script>
const D = {"c0x":[-1.414,-0.7344,2.1162,0.6473,-2.6661,-0.3188,-1.2563,-0.1492,-2.9559,0.0302,-0.0049,1.8502,0.1916,0.4036,-2.5471,2.7947,-3.0025,1.0551,-0.817,-1.6774,-1.4323,-1.433,0.0456,-0.5604,1.7718,-3.0709,-0.267,-1.8176,0.8365,-3.3026,-1.1221,-0.0594,-2.3932,0.8291,-0.0822,0.954,1.1087,-1.7718,-1.3374,-0.4493],"c0y":[0.5647,0.9135,1.7606,1.1073,-0.4967,0.6639,0.3337,0.8827,0.2505,0.8507,0.9016,1.9975,0.7879,1.0674,-0.1906,2.5354,-0.8136,1.9087,0.5032,0.2632,0.5869,0.529,1.3416,0.7852,1.8132,-0.3412,0.5609,0.5206,1.1435,-0.9363,1.1051,0.9232,-0.4872,1.9519,0.8529,1.766,1.2538,0.09,-0.1523,0.1938],"c1x":[-0.2207,0.3302,2.7591,1.1825,-1.5774,0.435,-0.2257,0.7844,-1.4785,1.0697,0.978,2.8734,0.9982,1.3481,-1.6433,3.6468,-2.0969,1.9449,0.0458,-0.6471,-0.3317,-0.3498,0.958,0.3173,2.5607,-2.0534,0.6218,-0.7277,1.7976,-2.5156,0.0775,0.8294,-1.554,1.92,0.8379,1.8079,1.8693,-0.6798,-0.5894,0.4833],"c1y":[-1.3976,-0.8632,0.5401,0.308,-2.0474,-0.4784,-1.285,-0.6744,-2.1401,-0.9512,-0.7775,-0.0218,-0.5286,-0.5815,-1.3729,0.7548,-1.9198,0.2653,-0.8116,-1.3063,-1.1758,-1.1935,-0.2137,-0.6031,0.3141,-1.7037,-0.8713,-1.1745,-0.5912,-1.7499,-0.9291,-0.5496,-1.5325,-0.1007,-0.6808,0.2176,-0.0856,-1.593,-1.1321,-1.2945],"mu0":[-0.5502,0.7323],"mu1":[0.3946,-0.7983],"w":[0.43925,-0.89837],"vp":[-0.91789,-0.39683],"z0":[-1.1285,-1.1432,-0.6521,-0.7104,-0.7249,-0.7364,-0.8516,-0.8586,-1.5234,-0.7509,-0.8121,-0.9818,-0.6237,-0.7816,-0.9476,-1.0501,-0.5879,-1.2513,-0.8109,-0.9732,-1.1563,-1.1047,-1.1852,-0.9516,-0.8506,-1.0424,-0.6212,-1.2661,-0.6599,-0.6095,-1.4857,-0.8555,-0.6135,-1.3893,-0.8023,-1.1675,-0.6393,-0.8591,-0.4507,-0.3714],"z1":[1.1586,0.9205,0.7267,0.2428,1.1464,0.6209,1.0553,0.9504,1.2731,1.3244,1.1281,1.2817,0.9134,1.1145,0.5116,0.9238,0.8036,0.616,0.7492,0.8893,0.9105,0.9186,0.6128,0.6812,0.8426,0.6286,1.0559,0.7355,1.3207,0.467,0.8687,0.8581,0.6942,0.9338,0.9797,0.5987,0.898,1.1325,0.7581,1.3752],"p0":[1.0738,0.3116,-2.6411,-1.0336,2.6443,0.0291,1.0207,-0.2133,2.6138,-0.3653,-0.3533,-2.4909,-0.4885,-0.794,2.4136,-3.5714,3.0788,-1.7259,0.5503,1.4352,1.0818,1.1055,-0.5742,0.2028,-2.3459,2.9541,0.0225,1.4618,-1.2216,3.403,0.5914,-0.3118,2.39,-1.5356,-0.263,-1.5765,-1.5152,1.5906,1.288,0.3355],"p1":[0.7572,0.0395,-2.7469,-1.2077,2.2604,-0.2095,0.7171,-0.4524,2.2064,-0.6044,-0.5892,-2.6288,-0.7065,-1.0066,2.0532,-3.6469,2.6866,-1.8904,0.28,1.1124,0.7711,0.7947,-0.7945,-0.0519,-2.4751,2.5609,-0.225,1.1341,-1.4154,3.0035,0.2976,-0.5432,2.0346,-1.7224,-0.4989,-1.7458,-1.6818,1.2562,0.9903,0.0701]};
const C0="#2471a3", C1="#c0392b";
function axis(v, mu, len, color, name){
  const m=mu||[0,0];
  return {x:[m[0]-len*v[0], m[0]+len*v[0]], y:[m[1]-len*v[1], m[1]+len*v[1]],
    mode:"lines", line:{color,width:3}, name};
}
function traces(id){
  const a={x:D.c0x,y:D.c0y,mode:"markers",name:"반 1",marker:{size:8,color:C0,opacity:0.88}};
  const b={x:D.c1x,y:D.c1y,mode:"markers",name:"반 2",marker:{size:8,color:C1,opacity:0.88}};
  const mid=[(D.mu0[0]+D.mu1[0])/2,(D.mu0[1]+D.mu1[1])/2];
  if(id==="scatter"){
    return [a,b,
      axis(D.vp, mid, 3.2, "#d68910", "PCA 1축"),
      axis(D.w, mid, 2.2, "#1e8449", "LDA 1축"),
      {x:[D.mu0[0]],y:[D.mu0[1]],mode:"markers",marker:{size:12,color:C0,symbol:"x"},name:"평균1",showlegend:false},
      {x:[D.mu1[0]],y:[D.mu1[1]],mode:"markers",marker:{size:12,color:C1,symbol:"x"},name:"평균2",showlegend:false}
    ];
  }
  if(id==="lda"){
    return [
      {x:D.z0,y:Array(D.z0.length).fill(0.12),mode:"markers",name:"반 1",marker:{size:9,color:C0,opacity:0.85}},
      {x:D.z1,y:Array(D.z1.length).fill(-0.12),mode:"markers",name:"반 2",marker:{size:9,color:C1,opacity:0.85}}
    ];
  }
  return [
    {x:D.p0,y:Array(D.p0.length).fill(0.12),mode:"markers",name:"반 1",marker:{size:9,color:C0,opacity:0.85}},
    {x:D.p1,y:Array(D.p1.length).fill(-0.12),mode:"markers",name:"반 2",marker:{size:9,color:C1,opacity:0.85}}
  ];
}
const TABS=[
  {id:"scatter",label:"1. 축 비교"},
  {id:"lda",label:"2. LDA 1축 사영"},
  {id:"pca",label:"3. PCA 1축 사영"}
];
const HINT={
  scatter:"노란 긴 줄이 PCA 1축(분산 최대), 초록 짧은 줄이 LDA 1축(반 사이 / 반 안). 가위표는 반 평균입니다.",
  lda:"LDA 1축 위의 점수입니다. 두 반이 거의 갈라집니다.",
  pca:"PCA 1축 위의 점수입니다. 긴 방향이라 두 반이 겹칩니다."
};
function layout(id){
  if(id==="scatter"){
    return {title:"PCA 1축 vs LDA 1축",xaxis:{title:"x",zeroline:true},yaxis:{title:"y",scaleanchor:"x",zeroline:true},
      legend:{orientation:"h",y:1.14},margin:{t:70,r:16,b:48,l:48}};
  }
  const t=id==="lda"?"LDA 1축 사영":"PCA 1축 사영";
  return {title:t,xaxis:{title:"1축 점수",zeroline:true},yaxis:{range:[-1,1],title:"",showticklabels:false},
    legend:{orientation:"h",y:1.14},margin:{t:70,r:16,b:48,l:48}};
}
function draw(id){
  document.getElementById("hint").textContent=HINT[id];
  const gd=document.getElementById("chart");
  Plotly.purge(gd);
  Plotly.newPlot(gd,traces(id),layout(id),{responsive:true,displaylogo:false});
}
function setTab(id){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  history.replaceState(null,"","#"+id);
  draw(id);
}
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.textContent=t.label; b.dataset.id=t.id; b.onclick=()=>setTab(t.id);
  document.getElementById("tabs").appendChild(b);
});
const start=(location.hash||"#scatter").replace("#","");
setTab(TABS.some(t=>t.id===start)?start:"scatter");
</script>
</body>
</html>
