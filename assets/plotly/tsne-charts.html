:root{--ink:#1b2430;--muted:#5d6d7e;--line:#e6ebf0;--bg:#f7f9fb}

.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 28px}

.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 12px}

.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:#1b2430;color:#fff;border-color:#1b2430}
.hint{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55;color:#34495e;margin-bottom:10px}
#chart{width:100%;height:560px;background:#fff;border:1px solid var(--line);border-radius:12px}
.hash-targets{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>

const COL=["#2471a3","#c0392b","#1e8449"];
function split(x,y,lab){
  const g=[{x:[],y:[]},{x:[],y:[]},{x:[],y:[]}];
  for(let i=0;i<x.length;i++){g[lab[i]].x.push(x[i]);g[lab[i]].y.push(y[i]);}
  return g.map((t,i)=>({x:t.x,y:t.y,mode:"markers",name:"묶음 "+(i+1),marker:{size:8,color:COL[i],opacity:0.88}}));
}
const TABS=[
  {id:"orig",label:"1. 원래 좌표"},
  {id:"pca",label:"2. PCA"},
  {id:"tsne",label:"3. t-SNE"}
];
const HINT={
  orig:"세 묶음이 이미 2차원에 떨어져 있습니다. 색은 묶음입니다. t-SNE는 이 이웃 관계를 저차원에서 다시 맞춥니다.",
  pca:"분산이 큰 축으로 돌린 결과입니다. 전역 모양은 유지되지만, 가까운 점만 더 또렷해지지는 않습니다.",
  tsne:"가까운 점은 가깝게, 먼 묶음은 떨어져 보입니다. 묶음 사이 거리와 넓이 숫자는 액면 그대로 읽지 않습니다."
};
function xy(id){
  if(id==="orig") return [D.x,D.y,"원래 x","원래 y"];
  if(id==="pca") return [D.px,D.py,"PC1","PC2"];
  return [D.tx,D.ty,"t-SNE 1","t-SNE 2"];
}
function draw(id){
  document.getElementById("hint").textContent=HINT[id];
  const [x,y,xt,yt]=xy(id);
  const gd=document.getElementById("chart");
  Plotly.purge(gd);
  Plotly.newPlot(gd,split(x,y,D.lab),{
    title:{orig:"원래 좌표",pca:"PCA",tsne:"t-SNE"}[id],
    xaxis:{title:xt,zeroline:true},
    yaxis:{title:yt,scaleanchor:"x",zeroline:true},
    legend:{orientation:"h",y:1.14},
    margin:{t:70,r:16,b:48,l:52}
  },{responsive:true,displaylogo:false});
}
function setTab(id){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  history.replaceState(null,"","#"+id);
  draw(id);
}
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.textContent=t.label; b.dataset.id=t.id; b.onclick=()=>setTab(t.id);
  document.getElementById("tabs").appendChild(b);
});
const start=(location.hash||"#orig").replace("#","");
setTab(TABS.some(t=>t.id===start)?start:"orig");
