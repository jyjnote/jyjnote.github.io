<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PCA 차트</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{
  --ink:#1b2430; --muted:#5d6d7e; --line:#e6ebf0;
  --blue:#2471a3; --red:#c0392b; --gold:#d68910; --green:#1e8449;
  --bg:#f7f9fb; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:20px;margin:4px 0 8px;letter-spacing:-.02em}
.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{
  border:1px solid var(--line);background:#fff;color:#2c3e50;
  border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer
}
.tabs button.on{background:#1b2430;color:#fff;border-color:#1b2430}
.hint{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:13.5px;line-height:1.55;color:#34495e;margin-bottom:10px}
.hint b{color:var(--red)}
#chart{width:100%;height:560px;background:#fff;border:1px solid var(--line);border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-size:16px;font-weight:700;margin-top:2px}
</style>
</head>

function axisLine(mu, v, len, color, name, dash){
  const x = [mu[0]-len*v[0], mu[0]+len*v[0]];
  const y = [mu[1]-len*v[1], mu[1]+len*v[1]];
  return {x,y,mode:"lines",line:{color,width:3,dash:dash||"solid"},name,hoverinfo:"name"};
}
function arrowHead(mu, v, len, color){
  const x = mu[0]+len*v[0], y = mu[1]+len*v[1];
  return {x:[x],y:[y],mode:"markers",marker:{size:10,color,symbol:"triangle-up"},
    hoverinfo:"skip",showlegend:false};
}
function setStats(items){
  document.getElementById("stats").innerHTML = items.map(it =>
    `<div class="stat"><div class="k">${it.k}</div><div class="v">${it.v}</div></div>`
  ).join("");
}

function tracesAxes(step){
  const E=D.exam, mu=E.mu, V=E.evecs;
  const pts={x:E.x,y:E.y,mode:"markers",name:"학생",
    marker:{size:8,color:COL.a,opacity:0.82},
    text:E.x.map((_,i)=>`중간 ${E.x[i]} / 기말 ${E.y[i]}`),hoverinfo:"text"};
  const pc1=axisLine(mu,[V[0][0],V[1][0]],22,COL.b,"PC1");
  const pc2=axisLine(mu,[V[0][1],V[1][1]],8,COL.gray,"PC2","dash");
  const mean={x:[mu[0]],y:[mu[1]],mode:"markers",name:"평균",
    marker:{size:12,color:COL.gold,symbol:"x",line:{width:2}}};
  if(step===0) return [pts, mean];
  if(step===1) return [pts, pc1, pc2, mean];
  // drop onto PC1
  const segs=[];
  const xs=[],ys=[],xh=[],yh=[];
  for(let i=0;i<E.x.length;i++){
    xs.push(E.x[i], E.xhat[i], null);
    ys.push(E.y[i], E.yhat[i], null);
  }
  return [
    pts,
    {x:xs,y:ys,mode:"lines",line:{color:"rgba(192,57,43,0.25)",width:1},name:"사영",hoverinfo:"skip"},
    {x:E.xhat,y:E.yhat,mode:"markers",name:"PC1 위",marker:{size:7,color:COL.b}},
    pc1, pc2, mean
  ];
}

function tracesScree(){
  const s=D.scree;
  return [
    {x:s.names,y:s.ratio.map(v=>+(v*100).toFixed(2)),type:"bar",name:"설명 비율(%)",
     marker:{color:["#c0392b","#2471a3","#7f8c8d","#bdc3c7"],opacity:0.9},
     text:s.ratio.map(v=>(v*100).toFixed(1)+"%"),textposition:"outside"},
    {x:s.names,y:s.cum.map(v=>+(v*100).toFixed(2)),type:"scatter",mode:"lines+markers",
     name:"누적(%)",yaxis:"y2",line:{color:COL.gold,width:3},marker:{size:9,color:COL.gold}}
  ];
}

function tracesScale(mode){
  // 0 raw, 1 std
  if(mode===0){
    const S=D.scale, mu=S.mu, V=S.raw_v;
    return [
      {x:S.h,y:S.q,mode:"markers",name:"키·퀴즈",marker:{size:8,color:COL.a,opacity:0.85}},
      axisLine(mu,[V[0][0],V[1][0]],20,COL.b,"PC1 raw"),
      axisLine(mu,[V[0][1],V[1][1]],8,COL.gray,"PC2 raw","dash"),
      {x:[mu[0]],y:[mu[1]],mode:"markers",name:"평균",marker:{size:11,color:COL.gold,symbol:"x",line:{width:2}}}
    ];
  }
  const S=D.scale, V=S.std_v;
  return [
    {x:S.hz,y:S.qz,mode:"markers",name:"표준화 좌표",marker:{size:8,color:COL.g,opacity:0.85}},
    axisLine([0,0],[V[0][0],V[1][0]],3.2,COL.b,"PC1 std"),
    axisLine([0,0],[V[0][1],V[1][1]],2.4,COL.gray,"PC2 std","dash"),
    {x:[0],y:[0],mode:"markers",name:"원점",marker:{size:11,color:COL.gold,symbol:"x",line:{width:2}}}
  ];
}

function tracesRecon(){
  const E=D.exam;
  const xs=[],ys=[];
  for(let i=0;i<E.x.length;i++){
    xs.push(E.x[i],E.xhat[i],null);
    ys.push(E.y[i],E.yhat[i],null);
  }
  return [
    {x:xs,y:ys,mode:"lines",line:{color:"rgba(93,109,126,0.35)",width:1},name:"잔차",hoverinfo:"skip"},
    {x:E.x,y:E.y,mode:"markers",name:"원래",marker:{size:8,color:COL.a,opacity:0.8}},
    {x:E.xhat,y:E.yhat,mode:"markers",name:"PC1 복원",marker:{size:8,color:COL.b}},
    axisLine(E.mu,[E.evecs[0][0],E.evecs[1][0]],22,COL.b,"PC1")
  ];
}

function tracesStripe(){
  const S=D.stripe, mu=S.mu, V=S.evecs;
  const x0=[],y0=[],x1=[],y1=[];
  for(let i=0;i<S.x.length;i++){
    if(S.cls[i]===0){x0.push(S.x[i]);y0.push(S.y[i]);}
    else {x1.push(S.x[i]);y1.push(S.y[i]);}
  }
  return [
    {x:x0,y:y0,mode:"markers",name:"반 A",marker:{size:8,color:COL.a,opacity:0.88}},
    {x:x1,y:y1,mode:"markers",name:"반 B",marker:{size:8,color:COL.g,opacity:0.88}},
    axisLine(mu,[V[0][0],V[1][0]],6.2,COL.b,"PCA 1축"),
    axisLine(mu,[V[0][1],V[1][1]],3.2,COL.gold,"PCA 2축","dash"),
    {x:[mu[0]],y:[mu[1]],mode:"markers",name:"평균",marker:{size:11,color:"#8e44ad",symbol:"x",line:{width:2}}}
  ];
}

const TITLES = {
  axes:["원래 점수 구름","PC1 · PC2 축","점들을 PC1 위에 떨어뜨림"],
  scale:["단위 그대로 (키가 이김)","표준화 후 (두 과목을 공평히)"],
};

function layoutAxes(step){
  return {
    title:TITLES.axes[step],
    xaxis:{title:"중간고사",zeroline:false},
    yaxis:{title:"기말고사",scaleanchor:"x",zeroline:false},
    legend:{orientation:"h",y:1.14},
    margin:{t:70,r:16,b:48,l:52},
    sliders:[{
      pad:{t:28}, currentvalue:{prefix:"단계  ",font:{size:13}},
      steps:[0,1,2].map(i=>({
        method:"animate", label:["구름","축","사영"][i],
        args:[[String(i)],{mode:"immediate",frame:{duration:0,redraw:true},transition:{duration:0}}]
      }))
    }]
  };
}

function draw(id){
  const hint=document.getElementById("hint");
  hint.innerHTML=HINT[id];
  const gd=document.getElementById("chart");
  if(id==="axes"){
    const E=D.exam;
    setStats([
      {k:"PC1 설명 비율", v:(E.ratio[0]*100).toFixed(1)+"%"},
      {k:"PC2 설명 비율", v:(E.ratio[1]*100).toFixed(1)+"%"},
      {k:"PC1 방향", v:"거의 (1, 1) · 중간=기말"},
      {k:"학생 수", v:String(E.x.length)}
    ]);
    Plotly.purge(gd);
    Plotly.newPlot(gd, tracesAxes(0), layoutAxes(0), {responsive:true,displaylogo:false}).then(()=>{
      Plotly.addFrames(gd,[0,1,2].map(i=>({name:String(i),data:tracesAxes(i),layout:{title:TITLES.axes[i]}})));
    });
    return;
  }
  if(id==="scree"){
    const s=D.scree;
    setStats([
      {k:"λ1 / 전체", v:(s.ratio[0]*100).toFixed(1)+"%"},
      {k:"누적 2개", v:(s.cum[1]*100).toFixed(1)+"%"},
      {k:"누적 3개", v:(s.cum[2]*100).toFixed(1)+"%"},
      {k:"해석", v:"PC1이 거의 전부"}
    ]);
    Plotly.purge(gd);
    Plotly.newPlot(gd, tracesScree(), {
      title:"스크리 · 누적 설명 분산",
      xaxis:{title:"주성분"},
      yaxis:{title:"설명 비율 (%)",range:[0,110]},
      yaxis2:{title:"누적 (%)",overlaying:"y",side:"right",range:[0,110]},
      legend:{orientation:"h",y:1.14},
      margin:{t:70,r:56,b:48,l:52},
      bargap:0.35
    },{responsive:true,displaylogo:false});
    return;
  }
  if(id==="scale"){
    const S=D.scale;
    setStats([
      {k:"그대로 PC1 비율", v:(S.raw_ratio[0]*100).toFixed(1)+"%"},
      {k:"그대로 PC1 로딩", v:"키 "+S.raw_v[0][0].toFixed(2)+" · 퀴즈 "+S.raw_v[1][0].toFixed(2)},
      {k:"표준화 PC1 비율", v:(S.std_ratio[0]*100).toFixed(1)+"%"},
      {k:"표준화 PC1 로딩", v:"둘 다 약 0.71"}
    ]);
    Plotly.purge(gd);
    Plotly.newPlot(gd, tracesScale(0), {
      title:TITLES.scale[0],
      xaxis:{title:"키 (cm)"},
      yaxis:{title:"퀴즈 점수",scaleanchor:"x"},
      legend:{orientation:"h",y:1.14},
      margin:{t:70,r:16,b:48,l:52},
      sliders:[{
        pad:{t:28}, currentvalue:{prefix:"",font:{size:13}},
        steps:[
          {method:"animate",label:"단위 그대로",args:[["0"],{mode:"immediate",frame:{duration:0,redraw:true},transition:{duration:0}}]},
          {method:"animate",label:"표준화",args:[["1"],{mode:"immediate",frame:{duration:0,redraw:true},transition:{duration:0}}]}
        ]
      }]
    },{responsive:true,displaylogo:false}).then(()=>{
      Plotly.addFrames(gd,[
        {name:"0",data:tracesScale(0),layout:{title:TITLES.scale[0],
          xaxis:{title:"키 (cm)"},yaxis:{title:"퀴즈 점수"}}},
        {name:"1",data:tracesScale(1),layout:{title:TITLES.scale[1],
          xaxis:{title:"키 (표준화)"},yaxis:{title:"퀴즈 (표준화)",scaleanchor:"x"}}}
      ]);
    });
    return;
  }
  if(id==="recon"){
    const E=D.exam;
    setStats([
      {k:"버린 분산", v:(E.ratio[1]*100).toFixed(2)+"%"},
      {k:"복원", v:"x̂ = x̄ + v1 z1"},
      {k:"잔차 방향", v:"PC2와 평행"},
      {k:"이상치 단서", v:"잔차 큰 점"}
    ]);
    Plotly.purge(gd);
    Plotly.newPlot(gd, tracesRecon(), {
      title:"PC1만 남기고 다시 펼치기",
      xaxis:{title:"중간고사"},
      yaxis:{title:"기말고사",scaleanchor:"x"},
      legend:{orientation:"h",y:1.14},
      margin:{t:70,r:16,b:48,l:52}
    },{responsive:true,displaylogo:false});
    return;
  }
  if(id==="stripe"){
    const S=D.stripe;
    setStats([
      {k:"PC1 분산 비율", v:((S.evals[0]/(S.evals[0]+S.evals[1]))*100).toFixed(1)+"%"},
      {k:"PCA가 본 것", v:"띠가 긴 방향"},
      {k:"반을 가르는 것", v:"짧은 2축 쪽"},
      {k:"시험 함정", v:"분산 최대 ≠ 분류 최적"}
    ]);
    Plotly.purge(gd);
    Plotly.newPlot(gd, tracesStripe(), {
      title:"두 반이 나란한 띠일 때",
      xaxis:{title:"특징 1",zeroline:false},
      yaxis:{title:"특징 2",scaleanchor:"x",zeroline:false},
      legend:{orientation:"h",y:1.14},
      margin:{t:70,r:16,b:48,l:52}
    },{responsive:true,displaylogo:false});
  }
}

function setTab(id){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  history.replaceState(null,"","#"+id);
  draw(id);
}

const tabBox=document.getElementById("tabs");
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.textContent=t.label; b.dataset.id=t.id;
  b.onclick=()=>setTab(t.id);
  tabBox.appendChild(b);
});
const start=(location.hash||"#axes").replace("#","");
setTab(TABS.some(t=>t.id===start)?start:"axes");
</script>
</body>
</html>
