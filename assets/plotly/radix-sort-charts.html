<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>기수 정렬 단계</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--ink:#1b2430;--muted:#5d6d7e;--line:#e6ebf0;--red:#c0392b;--bg:#f7f9fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 24px}
h1{font-size:20px;margin:4px 0 8px}
.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tabs button{border:1px solid var(--line);background:#fff;color:#2c3e50;
  border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:#1b2430;color:#fff;border-color:#1b2430}
.hint{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:13.5px;line-height:1.55;color:#34495e;margin-bottom:10px}
.hint b{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.row button{border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:6px 12px;cursor:pointer;font-size:13px}
#chart{width:100%;height:460px;background:#fff;border:1px solid var(--line);border-radius:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#34495e}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>기수 정렬이 한 번에 하는 일</h1>
  <p class="lead">일의 자리부터 안정 계수 정렬을 반복합니다. 낮은 자리가 같으면 이전 패스에서 만든 순서가 그대로 남습니다.</p>
  <div class="hash-targets" aria-hidden="true">
    <span id="step"></span><span id="pass"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="hint" id="hint"></div>
  <div class="row">
    <button type="button" id="prev">이전</button>
    <button type="button" id="next">다음</button>
    <button type="button" id="play">자동</button>
    <button type="button" id="reset">처음</button>
  </div>
  <div id="chart"></div>
  <div class="legend">
    <span><i class="sw" style="background:#d68910"></i>지금 보는 값</span>
    <span><i class="sw" style="background:#8e44ad"></i>방금 출력에 기록</span>
    <span><i class="sw" style="background:#2471a3"></i>이번 패스 입력</span>
    <span><i class="sw" style="background:#1e8449"></i>출력에 확정</span>
    <span><i class="sw" style="background:#95a5a6"></i>아직 빈 출력</span>
  </div>
</div>
<script>
const NAMES = ["A","B","C","D","E"];
function digit(x, exp){ return Math.floor(x/exp)%10; }
function buildSteps(){
  let a = [80, 55, 90, 70, 60];
  const n = a.length;
  const out = [];
  out.push({a:a.slice(), B:Array(n).fill(null), hi:-1, bi:-1, pass:0, exp:1,
    msg:"시작 [80, 55, 90, 70, 60]. 일의 자리(exp=1)부터 계수합니다."});
  for(const exp of [1,10]){
    const C = Array(10).fill(0);
    const pass = exp===1?1:2;
    const label = exp===1?"일의 자리":"십의 자리";
    out.push({a:a.slice(), B:Array(n).fill(null), hi:-1, bi:-1, pass:pass, exp:exp,
      msg:`패스 ${pass}. ${label}. 숫자 = floor(x/${exp}) mod 10.`});
    for(let i=0;i<n;i++){
      const d = digit(a[i], exp);
      C[d]++;
      out.push({a:a.slice(), B:Array(n).fill(null), hi:i, bi:-1, pass:pass, exp:exp,
        msg:`패스 ${pass} 세기. ${a[i]}의 자리 숫자 ${d}. count[${d}]=${C[d]}.`});
    }
    for(let t=1;t<10;t++) C[t]+=C[t-1];
    out.push({a:a.slice(), B:Array(n).fill(null), hi:-1, bi:-1, pass:pass, exp:exp,
      msg:`패스 ${pass} 누적 완료. 자리 숫자별 마지막 인덱스를 확보.`});
    const B = Array(n).fill(null);
    for(let i=n-1;i>=0;i--){
      const d = digit(a[i], exp);
      C[d]--;
      const pos = C[d];
      B[pos] = a[i];
      out.push({a:a.slice(), B:B.slice(), hi:i, bi:pos, pass:pass, exp:exp,
        msg:`패스 ${pass} 배치. ${a[i]} (자리 ${d}) → 출력[${pos}].`});
    }
    a = B.slice();
    out.push({a:a.slice(), B:B.slice(), hi:-1, bi:-1, pass:pass, exp:exp,
      msg:`패스 ${pass} 종료 [${a.join(", ")}].`});
  }
  out.push({a:a.slice(), B:a.slice(), hi:-1, bi:-1, pass:2, exp:10,
    msg:"정렬 끝 [55, 60, 70, 80, 90]. 자리 2번 × 안정 계수."});
  return out;
}
function buildPasses(){
  return buildSteps().filter(s =>
    s.msg.indexOf("시작")>=0 || s.msg.indexOf("종료")>=0 || s.msg.indexOf("정렬 끝")>=0 ||
    s.msg.indexOf("패스 1.")>=0 || s.msg.indexOf("패스 2.")>=0);
}
const PACK = {step: buildSteps(), pass: buildPasses()};
let mode = "step", idx = 0, timer = null;

function draw(){
  const f = PACK[mode][idx];
  document.getElementById("hint").innerHTML = "<b>"+(idx+1)+"/"+PACK[mode].length+".</b> "+f.msg;
  const colA = f.a.map((_,i)=> i===f.hi ? "#d68910" : "#2471a3");
  const yB = f.B.map(v => v===null ? 0 : v);
  const tB = f.B.map(v => v===null ? "" : String(v));
  const colB = f.B.map((v,i)=>{
    if(i===f.bi) return "#8e44ad";
    if(v===null) return "#d5d8dc";
    return "#1e8449";
  });
  Plotly.react("chart", [
    {x:NAMES, y:f.a, type:"bar", text:f.a.map(String), textposition:"outside",
      marker:{color:colA}, hovertemplate:"입력 %{x}=%{y}<extra></extra>"},
    {x:NAMES, y:yB, type:"bar", text:tB, textposition:"outside",
      marker:{color:colB}, hovertemplate:"출력 %{x}=%{y}<extra></extra>",
      xaxis:"x2", yaxis:"y2"}
  ], {
    grid:{rows:2, columns:1, pattern:"independent", roworder:"top to bottom"},
    yaxis:{title:"이번 입력", range:[0,110], domain:[0.52,1]},
    yaxis2:{title:"이번 출력", range:[0,110], domain:[0,0.42]},
    xaxis:{anchor:"y"},
    xaxis2:{anchor:"y2", title:"학생 위치"},
    margin:{t:28,r:16,b:40,l:48},
    plot_bgcolor:"#fff", paper_bgcolor:"#fff",
    showlegend:false,
    annotations:[{
      text: f.exp===1 ? "지금 보는 자리: 일의 자리" : "지금 보는 자리: 십의 자리",
      xref:"paper", yref:"paper", x:0, y:1.08, showarrow:false,
      font:{size:12, color:"#5d6d7e"}, xanchor:"left"
    }]
  }, {responsive:true, displayModeBar:false});
}
function setMode(id){
  mode = id; idx = 0; stop();
  [...document.getElementById("tabs").children].forEach(b=>b.classList.toggle("on", b.dataset.id===id));
  history.replaceState(null,"","#"+id);
  draw();
}
function stop(){ if(timer){clearInterval(timer); timer=null; document.getElementById("play").textContent="자동";} }
function next(){ if(idx<PACK[mode].length-1){idx++; draw();} else stop(); }
function prev(){ if(idx>0){idx--; draw();} }
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;
document.getElementById("reset").onclick=()=>{idx=0; stop(); draw();};
document.getElementById("play").onclick=function(){
  if(timer){stop(); return;}
  this.textContent="정지";
  timer=setInterval(next, 900);
};
const TABS=[{id:"step",label:"1. 세기·배치 한 번씩"},{id:"pass",label:"2. 패스 종료만"}];
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.textContent=t.label; b.dataset.id=t.id;
  b.onclick=()=>setMode(t.id);
  document.getElementById("tabs").appendChild(b);
});
setMode((location.hash||"#step").slice(1)==="pass"?"pass":"step");
</script>
</body>
</html>
