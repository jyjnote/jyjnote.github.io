const C0="#2471a3", C1="#c0392b";
function split(x,y,lab){
  const a={x:[],y:[]}, b={x:[],y:[]};
  for(let i=0;i<x.length;i++){
    if(lab[i]===0){a.x.push(x[i]);a.y.push(y[i]);}
    else {b.x.push(x[i]);b.y.push(y[i]);}
  }
  return [
    {x:a.x,y:a.y,mode:"markers",name:"반 1",marker:{size:8,color:C0,opacity:0.88}},
    {x:b.x,y:b.y,mode:"markers",name:"반 2",marker:{size:8,color:C1,opacity:0.88}}
  ];
}
const TABS=[
  {id:"orig",label:"1. 원래 좌표"},
  {id:"pca",label:"2. 선형 PCA"},
  {id:"rbf",label:"3. RBF Kernel PCA"},
  {id:"gamma",label:"4. 감마"}
];
const HINT={
  orig:"색은 반입니다. 두 반이 초승달처럼 껴 있습니다. 직선 축만으로는 잘 안 갈라집니다.",
  pca:"선형 PCA의 PC1·PC2입니다. 축을 돌려도 초승달이 펴지지 않고, 두 반이 겹칩니다.",
  rbf:"RBF 핵, 감마=12. 비슷한 점끼리 가깝게 붙어 두 반이 거의 갈라집니다.",
  gamma:"감마가 작으면(0.5) 선형 PCA와 비슷합니다. 감마가 크면(40) 점이 흩어지거나 한쪽에 몰립니다."
};
function traces(id, step){
  if(id==="orig") return split(D.mx,D.my,D.lab);
  if(id==="pca") return split(D.px,D.py,D.lab);
  if(id==="rbf") return split(D.kx,D.ky,D.lab);
  if(step===1) return split(D.hix,D.hiy,D.lab);
  return split(D.lox,D.loy,D.lab);
}
function layout(id, step){
  const titles={
    orig:"원래 좌표",
    pca:"선형 PCA (PC1, PC2)",
    rbf:"RBF Kernel PCA (감마=12)",
    gamma: step===1 ? "RBF 감마=40 (큼)" : "RBF 감마=0.5 (작음)"
  };
  const xy={
    orig:["원래 x","원래 y"],
    pca:["PC1","PC2"],
    rbf:["KPCA1","KPCA2"],
    gamma:["KPCA1","KPCA2"]
  }[id];
  const L={
    title:titles[id],
    xaxis:{title:xy[0],zeroline:true},
    yaxis:{title:xy[1],scaleanchor:"x",zeroline:true},
    legend:{orientation:"h",y:1.14},
    margin:{t:70,r:16,b:48,l:52}
  };
  if(id==="gamma"){
    L.sliders=[{
      pad:{t:28}, currentvalue:{prefix:"감마  ",font:{size:13}},
      steps:[
        {method:"animate",label:"0.5",args:[["0"],{mode:"immediate",frame:{duration:0,redraw:true},transition:{duration:0}}]},
        {method:"animate",label:"40",args:[["1"],{mode:"immediate",frame:{duration:0,redraw:true},transition:{duration:0}}]}
      ]
    }];
  }
  return L;
}
function draw(id){
  document.getElementById("hint").textContent=HINT[id];
  const gd=document.getElementById("chart");
  Plotly.purge(gd);
  Plotly.newPlot(gd, traces(id,0), layout(id,0), {responsive:true,displaylogo:false}).then(()=>{
    if(id!=="gamma") return;
    Plotly.addFrames(gd,[
      {name:"0",data:traces("gamma",0),layout:{title:"RBF 감마=0.5 (작음)"}},
      {name:"1",data:traces("gamma",1),layout:{title:"RBF 감마=40 (큼)"}}
    ]);
  });
}
function setTab(id){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  history.replaceState(null,"","#"+id);
  draw(id);
}
const box=document.getElementById("tabs");
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.textContent=t.label; b.dataset.id=t.id; b.onclick=()=>setTab(t.id);
  box.appendChild(b);
});
const start=(location.hash||"#orig").replace("#","");
setTab(TABS.some(t=>t.id===start)?start:"orig");
</script>
</body>
</html>
