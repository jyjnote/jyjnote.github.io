<style>
:root{--ink:#1b2430;--muted:#5d6d7e;--line:#e6ebf0;--bg:#f7f9fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:20px;margin:4px 0 8px}
.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:#1b2430;color:#fff;border-color:#1b2430}
.hint{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55;color:#34495e;margin-bottom:10px}
#chart{width:100%;height:560px;background:#fff;border:1px solid var(--line);border-radius:12px}
.hash-targets{position:absolute;width:0;height:0;overflow:hidden}
</style>

function axis(v, len, color, name){
  return {x:[-len*v[0], len*v[0]], y:[-len*v[1], len*v[1]],
    mode:"lines",line:{color,width:3},name};
}
function traces(id){
  const V=D.V, U=D.U, s=D.S;
  if(id==="input"){
    return [
      {x:D.cx,y:D.cy,mode:"lines",line:{color:"#2471a3",width:2},name:"단위원"},
      axis([V[0][0],V[1][0]],1.2,"#c0392b","v1"),
      axis([V[0][1],V[1][1]],1.2,"#1e8449","v2")
    ];
  }
  if(id==="output"){
    return [
      {x:D.ex,y:D.ey,mode:"lines",line:{color:"#2471a3",width:2},name:"A로 보낸 타원"},
      axis([U[0][0],U[1][0]],s[0],"#c0392b","σ1 u1"),
      axis([U[0][1],U[1][1]],s[1],"#1e8449","σ2 u2")
    ];
  }
  // rank-1: stretch only first axis
  const r1x=[],r1y=[];
  for(let i=0;i<D.cx.length;i++){
    const xin=D.cx[i], yin=D.cy[i];
    const z1=V[0][0]*xin+V[1][0]*yin;
    r1x.push(s[0]*U[0][0]*z1);
    r1y.push(s[0]*U[1][0]*z1);
  }
  return [
    {x:D.ex,y:D.ey,mode:"lines",line:{color:"rgba(36,113,163,0.35)",width:2},name:"원래 타원"},
    {x:r1x,y:r1y,mode:"lines",line:{color:"#c0392b",width:3},name:"랭크 1 근사"}
  ];
}
const TABS=[
  {id:"input",label:"1. 단위원과 V"},
  {id:"output",label:"2. 타원과 U, σ"},
  {id:"rank1",label:"3. 랭크 1"}
];
const HINT={
  input:"파란 원은 길이 1인 모든 방향입니다. 빨간 줄이 v1, 초록 줄이 v2입니다. A는 이 두 방향을 타원의 긴 축·짧은 축으로 보냅니다.",
  output:"타원의 긴 반지름이 σ1=3, 짧은 반지름이 σ2=1입니다. 방향은 u1, u2입니다.",
  rank1:"σ2를 0으로 두면 타원이 긴 축 선분으로 접힙니다. 이것이 랭크 1 근사입니다."
};
function layout(id){
  const t={input:"보내기 전 (V)",output:"보낸 뒤 (UΣ)",rank1:"σ2=0으로 접기"};
  return {
    title:t[id],
    xaxis:{title:"x",range:[-3.4,3.4],zeroline:true},
    yaxis:{title:"y",range:[-3.4,3.4],scaleanchor:"x",zeroline:true},
    legend:{orientation:"h",y:1.14},
    margin:{t:70,r:16,b:48,l:48}
  };
}
function draw(id){
  document.getElementById("hint").textContent=HINT[id];
  const gd=document.getElementById("chart");
  Plotly.purge(gd);
  Plotly.newPlot(gd,traces(id),layout(id),{responsive:true,displaylogo:false});
}
function setTab(id){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  history.replaceState(null,"","#"+id);
  draw(id);
}
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.textContent=t.label; b.dataset.id=t.id; b.onclick=()=>setTab(t.id);
  document.getElementById("tabs").appendChild(b);
});
const start=(location.hash||"#input").replace("#","");
setTab(TABS.some(t=>t.id===start)?start:"input");
</script>
</body>
