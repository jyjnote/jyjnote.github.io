<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>계층적 군집 병합</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
html,body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hint{padding:10px 16px 0;font-size:14px;line-height:1.5;color:#34495e}
#chart{width:100%;height:560px}
</style>
</head>
<body>
<div class="hint">단일 연결(가장 가까운 쌍)으로 붙입니다. 같은 색이 한 군집입니다. 슬라이더를 밀면 A-B가 먼저 붙고, 마지막에 오른쪽 덩어리가 이어집니다.</div>
<div id="chart"></div>
<script>
const D = {"labels": ["A", "B", "C", "D", "E"], "lx": [1.0, 1.6, 2.2, 5.0, 5.6], "ly": [1.2, 1.0, 2.4, 4.8, 4.4], "frames": [{"title": "\uc2dc\uc791: \uc810\ub9c8\ub2e4 \uad70\uc9d1 \ud558\ub098", "groups": [{"x": [1.0], "y": [1.2], "text": ["A"], "color": "#2980b9"}, {"x": [1.6], "y": [1.0], "text": ["B"], "color": "#c0392b"}, {"x": [2.2], "y": [2.4], "text": ["C"], "color": "#27ae60"}, {"x": [5.0], "y": [4.8], "text": ["D"], "color": "#8e44ad"}, {"x": [5.6], "y": [4.4], "text": ["E"], "color": "#e67e22"}], "lines": [], "height": 0}, {"title": "1\ubc88\uc9f8 \ubcd1\ud569  \ub192\uc774\u22480.63", "groups": [{"x": [2.2], "y": [2.4], "text": ["C"], "color": "#2980b9"}, {"x": [5.0], "y": [4.8], "text": ["D"], "color": "#c0392b"}, {"x": [5.6], "y": [4.4], "text": ["E"], "color": "#27ae60"}, {"x": [1.0, 1.6], "y": [1.2, 1.0], "text": ["A", "B"], "color": "#8e44ad"}], "lines": [[1.0, 1.2, 1.3, 1.1], [1.6, 1.0, 1.3, 1.1]], "height": 0.63}, {"title": "2\ubc88\uc9f8 \ubcd1\ud569  \ub192\uc774\u22480.72", "groups": [{"x": [2.2], "y": [2.4], "text": ["C"], "color": "#2980b9"}, {"x": [1.0, 1.6], "y": [1.2, 1.0], "text": ["A", "B"], "color": "#c0392b"}, {"x": [5.0, 5.6], "y": [4.8, 4.4], "text": ["D", "E"], "color": "#27ae60"}], "lines": [[1.0, 1.2, 1.3, 1.1], [1.6, 1.0, 1.3, 1.1], [5.0, 4.8, 5.3, 4.6], [5.6, 4.4, 5.3, 4.6]], "height": 0.72}, {"title": "3\ubc88\uc9f8 \ubcd1\ud569  \ub192\uc774\u22481.52", "groups": [{"x": [5.0, 5.6], "y": [4.8, 4.4], "text": ["D", "E"], "color": "#2980b9"}, {"x": [2.2, 1.0, 1.6], "y": [2.4, 1.2, 1.0], "text": ["C", "A", "B"], "color": "#c0392b"}], "lines": [[5.0, 4.8, 5.3, 4.6], [5.6, 4.4, 5.3, 4.6], [2.2, 2.4, 1.6000000000000003, 1.5333333333333332], [1.0, 1.2, 1.6000000000000003, 1.5333333333333332], [1.6, 1.0, 1.6000000000000003, 1.5333333333333332]], "height": 1.52}, {"title": "4\ubc88\uc9f8 \ubcd1\ud569  \ub192\uc774\u22483.69", "groups": [{"x": [5.0, 5.6, 2.2, 1.0, 1.6], "y": [4.8, 4.4, 2.4, 1.2, 1.0], "text": ["D", "E", "C", "A", "B"], "color": "#2980b9"}], "lines": [[5.0, 4.8, 3.08, 2.76], [5.6, 4.4, 3.08, 2.76], [2.2, 2.4, 3.08, 2.76], [1.0, 1.2, 3.08, 2.76], [1.6, 1.0, 3.08, 2.76]], "height": 3.69}]};
function traces(f){
  const t = [];
  (f.lines||[]).forEach(l=>{
    t.push({x:[l[0],l[2]], y:[l[1],l[3]], mode:"lines", line:{color:"#bdc3c7", width:1}, hoverinfo:"skip", showlegend:false});
  });
  f.groups.forEach((g,i)=>{
    t.push({x:g.x, y:g.y, text:g.text, mode:"markers+text",
      textposition:"top center",
      marker:{size:14, color:g.color}, name:"군집 "+(i+1)});
  });
  return t;
}
const f0=D.frames[0];
Plotly.newPlot("chart", traces(f0), {
  title:f0.title,
  xaxis:{title:"x1", range:[0.4,6.2]},
  yaxis:{title:"x2", range:[0.4,5.6], scaleanchor:"x"},
  legend:{orientation:"h", y:1.14},
  margin:{t:80,r:16,b:48,l:48},
  sliders:[{
    pad:{t:26}, currentvalue:{prefix:""},
    steps: D.frames.map((f,i)=>({
      method:"animate", label:String(i),
      args:[[String(i)], {mode:"immediate", frame:{duration:0,redraw:true}, transition:{duration:0}}]
    }))
  }]
}, {responsive:true, displaylogo:false}).then(function(){
  Plotly.addFrames("chart", D.frames.map((f,i)=>({
    name:String(i), data:traces(f), layout:{title:f.title}
  })));
});
</script>
</body>
</html>
