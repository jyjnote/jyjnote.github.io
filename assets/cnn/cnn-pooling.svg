<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-label="최대·평균 풀링">
  <rect width="1080" height="450" fill="#f7f9fb"/>
  <style>
    .t { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #1b2430; }
    .m { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #5d6d7e; }
  </style>
  <text class="t" x="540" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2430">2×2 풀링: 특징은 그대로 두고 한 변만 줄인다</text>
<text class="m" x="540" y="60" text-anchor="middle" font-size="13">왼쪽 위 네 값 6, 6, 4, 4 → 최대 6, 평균 5</text>
<text class="t" x="200" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2430">특징맵 3×3</text>
<rect x="92" y="114" width="52" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text class="t" x="118.0" y="146.0" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">6</text>
<rect x="144" y="114" width="52" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text class="t" x="170.0" y="146.0" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">6</text>
<rect x="196" y="114" width="52" height="52" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="222.0" y="146.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">0</text>
<rect x="92" y="166" width="52" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text class="t" x="118.0" y="198.0" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">4</text>
<rect x="144" y="166" width="52" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text class="t" x="170.0" y="198.0" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">4</text>
<rect x="196" y="166" width="52" height="52" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="222.0" y="198.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">0</text>
<rect x="92" y="218" width="52" height="52" rx="6" fill="#eaf2f8" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="118.0" y="250.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">2</text>
<rect x="144" y="218" width="52" height="52" rx="6" fill="#eaf2f8" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="170.0" y="250.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">2</text>
<rect x="196" y="218" width="52" height="52" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="222.0" y="250.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">0</text>
<text class="t" x="200" y="292" text-anchor="middle" font-size="13" font-weight="500" fill="#5d6d7e">빨간 구역이 첫 풀링 창</text>
<text class="t" x="540" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1e8449">최대 풀링</text>
<rect x="488" y="150" width="70" height="70" rx="6" fill="#e8f8f5" stroke="#1e8449" stroke-width="2.4"/><text class="t" x="523.0" y="191.0" text-anchor="middle" font-size="18" font-weight="800" fill="#1e8449">6</text>
<rect x="568" y="150" width="70" height="70" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="603.0" y="191.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">6</text>
<rect x="488" y="230" width="70" height="70" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="523.0" y="271.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">4</text>
<rect x="568" y="230" width="70" height="70" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="603.0" y="271.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">4</text>
<text class="m" x="540" y="320" text-anchor="middle" font-size="13">max(6,6,4,4)=6</text>
<text class="t" x="860" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#d68910">평균 풀링</text>
<rect x="808" y="150" width="70" height="70" rx="6" fill="#fef5e7" stroke="#d68910" stroke-width="2.4"/><text class="t" x="843.0" y="191.0" text-anchor="middle" font-size="18" font-weight="800" fill="#d68910">5</text>
<rect x="888" y="150" width="70" height="70" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="923.0" y="191.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">2.5</text>
<rect x="808" y="230" width="70" height="70" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="843.0" y="271.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">3</text>
<rect x="888" y="230" width="70" height="70" rx="6" fill="#ffffff" stroke="#c5ced6" stroke-width="1.4"/><text class="t" x="923.0" y="271.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2430">1.5</text>
<text class="m" x="860" y="320" text-anchor="middle" font-size="13">(6+6+4+4)/4=5</text>
<rect x="70" y="350" width="940" height="78" rx="14" fill="#ffffff" stroke="#c5ced6"/>
<text class="t" x="540" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2430">풀링에는 학습할 가중치가 없다. 합성곱을 대체하지 않는다.</text>
<text class="m" x="540" y="408" text-anchor="middle" font-size="13">합성곱이 특징을 만들고, 풀링은 해상도만 줄인다.</text>
</svg>
