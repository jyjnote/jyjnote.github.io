<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-label="파라미터 수 비교">
  <rect width="1080" height="460" fill="#f7f9fb"/>
  <style>
    .t { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #1b2430; }
    .m { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #5d6d7e; }
  </style>
  <text class="t" x="540" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2430">같은 5×5 → 3×3, 채널 1에서 저장하는 수</text>
<rect x="250" y="210" width="160" height="90" rx="12" fill="#2471a3"/><text class="t" x="330" y="194" text-anchor="middle" font-size="18" font-weight="800" fill="#2471a3">10개</text><text class="t" x="330" y="328" text-anchor="middle" font-size="15" font-weight="700">합성곱</text><text class="m" x="330" y="350" text-anchor="middle" font-size="13">3×3 가중치 9 + 편향 1</text>
<rect x="670" y="70" width="160" height="230" rx="12" fill="#c0392b"/><text class="t" x="750" y="54" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">234개</text><text class="t" x="750" y="328" text-anchor="middle" font-size="15" font-weight="700">전결합</text><text class="m" x="750" y="350" text-anchor="middle" font-size="13">25×9 가중치 + 편향 9</text>
<rect x="70" y="370" width="940" height="70" rx="14" fill="#ffffff" stroke="#c5ced6"/>
<text class="t" x="540" y="400" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">CNN은 한 벌의 커널을 모든 위치에 재사용한다. 이 차이가 파라미터가 적은 이유다.</text>
</svg>
