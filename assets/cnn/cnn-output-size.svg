<text class="t" x="540" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">분모는 커널 크기 K가 아니라 스트라이드 S.  +1을 빼먹으면 I=K일 때 O=0이 된다.</text>
