<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CNN 작동 원리</title>
<style>
:root{
  --ink:#1b2430; --muted:#5d6d7e; --line:#e6ebf0; --bg:#f7f9fb; --red:#c0392b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 36px}
h1{font-size:20px;margin:4px 0 8px}
.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 16px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
nav a{
  border:1px solid var(--line);background:#fff;color:#2c3e50;text-decoration:none;
  border-radius:999px;padding:7px 12px;font-size:13px
}
nav a:hover{background:#1b2430;color:#fff;border-color:#1b2430}
figure{margin:0 0 28px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px}
figure img{display:block;width:100%;height:auto;border-radius:10px;background:#f7f9fb}
figcaption{padding:8px 6px 4px;font-size:13.5px;line-height:1.5;color:#34495e}
figcaption b{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>바닐라 CNN 작동 원리</h1>
  <p class="lead">같은 5×5 숫자로 합성곱, 특징맵, 출력 크기, 풀링, 파라미터, 층 순서를 그림으로 봅니다. 그림을 누르면 원본 SVG가 열립니다.</p>
  <nav>
    <a href="#conv">1. 합성곱</a>
    <a href="#map">2. 특징맵</a>
    <a href="#shape">3. 출력 크기</a>
    <a href="#pool">4. 풀링</a>
    <a href="#param">5. 파라미터</a>
    <a href="#stack">6. 층 쌓기</a>
  </nav>

  <figure id="conv">
    <a href="cnn-conv-step.svg"><img src="cnn-conv-step.svg" alt="5×5 입력 왼쪽 위를 3×3 커널이 덮어 z00=6을 계산"/></a>
    <figcaption><b>합성곱 한 칸.</b> 빨간 테두리 9칸을 커널과 곱해 더하면 특징맵 왼쪽 위가 6입니다.</figcaption>
  </figure>
  <figure id="map">
    <a href="cnn-feature-map.svg"><img src="cnn-feature-map.svg" alt="같은 커널을 옮겨 3×3 특징맵을 모두 채움"/></a>
    <figcaption><b>특징맵.</b> 같은 커널 한 벌을 9번 재사용합니다. 학습할 가중치는 위치마다 늘지 않습니다.</figcaption>
  </figure>
  <figure id="shape">
    <a href="cnn-output-size.svg"><img src="cnn-output-size.svg" alt="패딩과 스트라이드에 따른 출력 한 변"/></a>
    <figcaption><b>출력 한 변.</b> O = ⌊(I − K + 2P) / S⌋ + 1. 분모는 커널이 아니라 스트라이드입니다.</figcaption>
  </figure>
  <figure id="pool">
    <a href="cnn-pooling.svg"><img src="cnn-pooling.svg" alt="3×3 특징맵을 2×2 최대·평균 풀링"/></a>
    <figcaption><b>풀링.</b> 6,6,4,4의 최댓값은 6, 평균은 5. 가중치는 없고 해상도만 줄어듭니다.</figcaption>
  </figure>
  <figure id="param">
    <a href="cnn-params.svg"><img src="cnn-params.svg" alt="합성곱 10개 대 전결합 234개"/></a>
    <figcaption><b>파라미터.</b> 같은 5×5→3×3에서 합성곱은 10개, 전결합은 234개입니다.</figcaption>
  </figure>
  <figure id="stack">
    <a href="cnn-stack.svg"><img src="cnn-stack.svg" alt="Conv ReLU Pool을 반복한 뒤 전결합"/></a>
    <figcaption><b>골격.</b> 공간은 줄고 채널은 늘다가, 마지막 전결합이 클래스 점수를 냅니다.</figcaption>
  </figure>
</div>
</body>
</html>
