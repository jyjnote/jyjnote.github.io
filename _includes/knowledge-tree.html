<style>
.sktree{margin:0 0 2.4rem;padding:1rem .6rem 1.2rem;border:1px solid var(--main-border-color,#333);border-radius:18px;background:#0b0b0b;color:#e8e8e8}
.sktree-head{padding:.2rem .8rem .8rem}
.sktree-kicker{margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a}
.sktree-title{margin:.15rem 0 .25rem;font-size:1.35rem;color:#f3f3f3}
.sktree-desc{margin:0;color:#9a9a9a;font-size:.9rem}
.sktree-crumb{display:flex;flex-wrap:wrap;gap:.35rem;margin:.75rem 0 0;min-height:1.6rem}
.sktree-crumb button{border:0;background:transparent;color:#c9b07a;cursor:pointer;padding:0;font:inherit}
.sktree-crumb button:hover{text-decoration:underline}
.sktree-crumb span{color:#666}
.sktree-stage{position:relative;width:100%;height:520px;overflow:hidden}
.sktree-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sk-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.28rem;width:7.2rem;border:0;background:transparent;color:inherit;cursor:pointer;padding:0}
.sk-node:focus-visible{outline:2px solid #c9b07a}
.sk-dot{width:16px;height:16px;border-radius:50%;border:2px solid #6b3a44;background:#2a1518;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.sk-node.is-root .sk-dot{width:26px;height:26px;border-color:#e7d27a;background:#efe39a;box-shadow:0 0 18px rgba(231,210,122,.45)}
.sk-node.is-child .sk-dot{width:14px;height:14px}
.sk-node.is-leaf .sk-dot{border-color:#7a8cae;background:#1b2433}
.sk-label{font-size:.78rem;line-height:1.2;text-align:center;color:#cfcfcf;text-shadow:0 1px 2px #000}
.sk-node.is-root .sk-label{font-size:.95rem;font-weight:700;color:#fff}
.sk-sub{font-size:.68rem;color:#8d8d8d}
.sktree-hint{margin:.4rem .8rem 0;color:#777;font-size:.8rem}
@media (max-width:700px){.sktree-stage{height:460px}.sk-node{width:5.6rem}.sk-label{font-size:.7rem}}
</style>

<section class="sktree" aria-label="진리의 문">
  <div class="sktree-head">
    <p class="sktree-kicker">Constellation</p>
    <h2 class="sktree-title">진리의 문</h2>
    <p class="sktree-desc">큰 노드가 부모입니다. 아래로 뻗은 자식을 누르면 그 줄기가 중심으로 옵니다.</p>
    <div class="sktree-crumb" id="sk-crumb"></div>
  </div>
  <div class="sktree-stage" id="sk-stage">
    <svg id="sk-lines"></svg>
  </div>
  <p class="sktree-hint">글이 있는 잎은 클릭하면 글로 이동합니다.</p>
</section>

<script>
(function(){
  const tree = {
    name:"진리의 문",
    children:[
      {name:"기초", sub:"통계 · 확률 · 수학", children:[
        {name:"통계", href:"#"},{name:"확률", href:"#"},{name:"수학", href:"#"}
      ]},
      {name:"컴퓨터", sub:"정처기 뼈대", children:[
        {name:"운영체제", href:"#"},{name:"데이터베이스", href:"#"},{name:"네트워크", href:"#"},{name:"소프트웨어공학", href:"#"},{name:"자료구조", href:"#"}
      ]},
      {name:"데이터", sub:"빅분기 뼈대", children:[
        {name:"전처리", href:"#"},{name:"SQL", href:"#"},{name:"시각화", href:"#"},{name:"빅데이터", href:"#"}
      ]},
      {name:"AI", sub:"전공 · 생성형", children:[
        {name:"머신러닝", children:[
          {name:"선형 모델", children:[
            {name:"단순선형회귀", href:"/posts/simple-linear-regression/"},
            {name:"다중선형회귀", href:"/posts/multiple-linear-regression/"},
            {name:"다항회귀", href:"/posts/polynomial-regression/"},
            {name:"로지스틱회귀", href:"/posts/logistic-regression/"},
            {name:"소프트맥스회귀", href:"/posts/softmax-regression/"},
            {name:"Ridge", href:"/posts/ridge/"},
            {name:"Lasso", href:"/posts/lasso/"},
            {name:"Elastic Net", href:"/posts/elastic-net/"}
          ]},
          {name:"거리 기반", children:[
            {name:"KNN", href:"/posts/knn/"},
            {name:"Weighted KNN", href:"/posts/weighted-knn/"},
            {name:"Radius Neighbors", href:"/posts/radius-neighbors/"}
          ]},
          {name:"확률 모델", children:[
            {name:"가우시안 나이브베이즈", href:"#"},{name:"다항 나이브베이즈", href:"#"},{name:"베르누이 나이브베이즈", href:"#"},
            {name:"LDA", href:"#"},{name:"QDA", href:"#"},{name:"GMM", href:"#"}
          ]},
          {name:"트리", children:[
            {name:"ID3", href:"#"},{name:"C4.5", href:"#"},{name:"C5.0", href:"#"},{name:"CART", href:"#"},{name:"회귀나무", href:"#"}
          ]},
          {name:"앙상블", children:[
            {name:"Bagging", href:"#"},{name:"Random Forest", href:"#"},{name:"Extra Trees", href:"#"},{name:"AdaBoost", href:"#"},{name:"GBM", href:"#"},
            {name:"XGBoost", href:"#"},{name:"LightGBM", href:"#"},{name:"CatBoost", href:"#"},{name:"Voting", href:"#"},{name:"Stacking", href:"#"}
          ]},
          {name:"커널 · SVM", children:[
            {name:"Linear SVM", href:"#"},{name:"Soft Margin SVM", href:"#"},{name:"Kernel SVM", href:"#"},{name:"SVR", href:"#"},{name:"One-class SVM", href:"#"}
          ]},
          {name:"군집", children:[
            {name:"K-means", href:"#"},{name:"K-medoids", href:"#"},{name:"K-modes", href:"#"},{name:"계층적 군집", href:"#"},
            {name:"DBSCAN", href:"#"},{name:"Mean Shift", href:"#"},{name:"Spectral Clustering", href:"#"}
          ]},
          {name:"차원축소", children:[
            {name:"PCA", href:"#"},{name:"Kernel PCA", href:"#"},{name:"SVD", href:"#"},{name:"LDA", href:"#"},
            {name:"t-SNE", href:"#"},{name:"UMAP", href:"#"},{name:"NMF", href:"#"},{name:"ICA", href:"#"}
          ]},
          {name:"연관규칙", children:[
            {name:"Apriori", href:"#"},{name:"FP-Growth", href:"#"},{name:"Eclat", href:"#"}
          ]},
          {name:"학습 실무", href:"#"}
        ]},
        {name:"딥러닝", children:[
          {name:"MLP", href:"#"},{name:"CNN", href:"#"},{name:"RNN", href:"#"},{name:"LSTM", href:"#"},{name:"GRU", href:"#"},
          {name:"Transformer", href:"#"},{name:"Autoencoder", href:"#"},{name:"GAN", href:"#"},{name:"Diffusion", href:"#"}
        ]},
        {name:"생성형 AI", children:[
          {name:"BERT", href:"#"},{name:"GPT", href:"#"},{name:"T5", href:"#"},{name:"LLM", href:"#"},{name:"RAG", href:"#"},{name:"프롬프트", href:"#"}
        ]},
        {name:"응용", children:[
          {name:"비전", href:"#"},{name:"자연어", href:"#"},{name:"음성", href:"#"},{name:"추천", href:"#"},{name:"강화학습", href:"#"},{name:"에이전트", href:"#"}
        ]},
        {name:"학습 방법", children:[
          {name:"전이학습", href:"#"},{name:"미세조정", href:"#"},{name:"준지도학습", href:"#"},{name:"자기지도학습", href:"#"},{name:"대조학습", href:"#"},
          {name:"메타학습", href:"#"},{name:"연합학습", href:"#"},{name:"지속학습", href:"#"},{name:"능동학습", href:"#"},{name:"멀티태스크", href:"#"}
        ]},
        {name:"시스템", children:[
          {name:"양자화", href:"#"},{name:"가지치기", href:"#"},{name:"지식증류", href:"#"},{name:"LoRA", href:"#"},{name:"QLoRA", href:"#"},
          {name:"KV Cache", href:"#"},{name:"스펙큘레이티브 디코딩", href:"#"},{name:"FlashAttention", href:"#"},{name:"Continuous Batching", href:"#"},{name:"텐서병렬", href:"#"}
        ]},
        {name:"보안", children:[
          {name:"적대적 예제", href:"#"},{name:"데이터 중독", href:"#"},{name:"프롬프트 인젝션", href:"#"},{name:"탈옥", href:"#"},
          {name:"멤버십 추론", href:"#"},{name:"모델 추출", href:"#"},{name:"차등프라이버시", href:"#"},{name:"가드레일", href:"#"}
        ]}
      ]},
      {name:"자격증", sub:"실전 · 기출", children:[
        {name:"정보처리기사", href:"#"},{name:"빅데이터분석기사", href:"#"}
      ]},
      {name:"취준", sub:"면접 · 포트폴리오", children:[
        {name:"면접", href:"#"},{name:"포트폴리오", href:"#"}
      ]}
    ]
  };

  const stage = document.getElementById("sk-stage");
  const svg = document.getElementById("sk-lines");
  const crumb = document.getElementById("sk-crumb");
  let path = [tree];

  function current(){ return path[path.length-1]; }

  function place(){
    const node = current();
    const kids = node.children || [];
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const root = {x:w/2, y: Math.max(70, h*0.18)};
    const childY = Math.min(h-80, h*0.72);
    const n = kids.length;
    const span = Math.min(w-80, Math.max(220, n*78));
    const start = (w-span)/2;
    const childPos = kids.map((_,i)=>({
      x: n===1 ? w/2 : start + (span*i)/Math.max(n-1,1),
      y: childY + ((i%2)*18)
    }));

    stage.querySelectorAll(".sk-node").forEach(el=>el.remove());
    svg.innerHTML = "";

    childPos.forEach((p,i)=>{
      const line = document.createElementNS("http://www.w3.org/2000/svg","path");
      const midY = (root.y+p.y)/2;
      line.setAttribute("d", `M${root.x},${root.y+16} C${root.x},${midY} ${p.x},${midY} ${p.x},${p.y-16}`);
      line.setAttribute("fill","none");
      line.setAttribute("stroke", i===0 ? "#6ea0d4" : "#4a5a78");
      line.setAttribute("stroke-width", i===0 ? "3.2" : "1.4");
      svg.appendChild(line);
    });

    addBtn(node, root.x, root.y, "is-root", ()=>{});
    kids.forEach((kid,i)=>{
      const leaf = !kid.children || !kid.children.length;
      addBtn(kid, childPos[i].x, childPos[i].y, leaf ? "is-child is-leaf" : "is-child", ()=>{
        if(kid.href && leaf){
          if(kid.href !== "#") location.href = kid.href;
          return;
        }
        path.push(kid);
        drawCrumb();
        place();
      });
    });
  }

  function addBtn(node, x, y, cls, onClick){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sk-node " + cls;
    btn.style.left = x + "px";
    btn.style.top = y + "px";
    btn.innerHTML = `<span class="sk-dot"></span><span class="sk-label">${node.name}</span>${node.sub?`<span class="sk-sub">${node.sub}</span>`:""}`;
    btn.addEventListener("click", onClick);
    stage.appendChild(btn);
  }

  function drawCrumb(){
    crumb.innerHTML = "";
    path.forEach((n,i)=>{
      if(i){ const s=document.createElement("span"); s.textContent=" / "; crumb.appendChild(s); }
      const b=document.createElement("button");
      b.type="button";
      b.textContent=n.name;
      b.addEventListener("click",()=>{ path=path.slice(0,i+1); drawCrumb(); place(); });
      crumb.appendChild(b);
    });
  }

  drawCrumb();
  place();
  window.addEventListener("resize", place);
})();
</script>
